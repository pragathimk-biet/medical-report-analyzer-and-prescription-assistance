<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1550" width="1000" height="1550" style="background:#1e1e1e; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title Banner -->
  <rect x="50" y="30" width="900" height="60" rx="10" fill="#2d2d2d" stroke="#444444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="500" y="67" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle">Detailed End-to-End System Architecture</text>

  <!-- STAGE 1 SUBGRAPH -->
  <g filter="url(#shadow)">
    <rect x="180" y="110" width="640" height="270" rx="8" fill="#252526" stroke="#555555" stroke-width="1.5"/>
    <text x="200" y="135" fill="#cccccc" font-size="14" font-weight="bold">1. Input Routing &amp; Context Initialization</text>

    <!-- Node: Raw Input -->
    <rect x="330" y="155" width="340" height="45" rx="4" fill="#1e1e1e" stroke="#777777" stroke-width="1.2"/>
    <text x="500" y="182" fill="#ffffff" font-size="14" font-weight="500" text-anchor="middle">Raw Input: Image / PDF / Text</text>

    <!-- Arrow 1 -->
    <line x1="500" y1="200" x2="500" y2="230" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Node: Input Router Agent -->
    <rect x="350" y="235" width="300" height="45" rx="4" fill="#1e1e1e" stroke="#777777" stroke-width="1.2"/>
    <text x="500" y="262" fill="#ffffff" font-size="14" font-weight="500" text-anchor="middle">Input Router Agent</text>

    <!-- Arrow 2 -->
    <line x1="500" y1="280" x2="500" y2="310" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Node: Context Payload -->
    <rect x="330" y="315" width="340" height="45" rx="4" fill="#1e1e1e" stroke="#777777" stroke-width="1.2"/>
    <text x="500" y="342" fill="#ffffff" font-size="14" font-weight="500" text-anchor="middle">Pipeline Context Payload</text>
  </g>

  <!-- Branch Arrows from Stage 1 to Stage 2 -->
  <path d="M 420 380 L 420 415 L 290 415 L 290 445" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="235" y="402" width="165" height="24" rx="4" fill="#2d2d2d" stroke="#444444"/>
  <text x="317" y="418" fill="#cccccc" font-size="11" text-anchor="middle">document_type: medical_report</text>

  <path d="M 580 380 L 580 415 L 710 415 L 710 445" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="620" y="402" width="165" height="24" rx="4" fill="#2d2d2d" stroke="#444444"/>
  <text x="702" y="418" fill="#cccccc" font-size="11" text-anchor="middle">document_type: prescription</text>

  <!-- STAGE 2 SUBGRAPH -->
  <g filter="url(#shadow)">
    <rect x="80" y="450" width="840" height="200" rx="8" fill="#252526" stroke="#555555" stroke-width="1.5"/>
    <text x="100" y="475" fill="#cccccc" font-size="14" font-weight="bold">2. Parallel Pipeline Extraction</text>

    <!-- Node: Report Extraction -->
    <rect x="130" y="495" width="320" height="45" rx="4" fill="#1e1e1e" stroke="#777777" stroke-width="1.2"/>
    <text x="290" y="522" fill="#ffffff" font-size="14" font-weight="500" text-anchor="middle">Report Extraction Agent</text>

    <!-- Arrow Extraction A -->
    <line x1="290" y1="540" x2="290" y2="575" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="105" y="580" width="370" height="28" rx="4" fill="#2d2d2d" stroke="#444444"/>
    <text x="290" y="598" fill="#cccccc" font-size="11" text-anchor="middle">biomarkers, numeric values, units, ref ranges</text>

    <!-- Node: Prescription Extraction -->
    <rect x="550" y="495" width="320" height="45" rx="4" fill="#1e1e1e" stroke="#777777" stroke-width="1.2"/>
    <text x="710" y="522" fill="#ffffff" font-size="14" font-weight="500" text-anchor="middle">Prescription Extraction Agent</text>

    <!-- Arrow Extraction B -->
    <line x1="710" y1="540" x2="710" y2="575" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="515" y="580" width="390" height="28" rx="4" fill="#2d2d2d" stroke="#444444"/>
    <text x="710" y="598" fill="#cccccc" font-size="11" text-anchor="middle">medications, strengths, forms, frequencies, durations</text>
  </g>

  <!-- Arrows Stage 2 to Stage 3 -->
  <line x1="290" y1="650" x2="290" y2="695" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="710" y1="650" x2="710" y2="695" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STAGE 3 SUBGRAPH -->
  <g filter="url(#shadow)">
    <rect x="80" y="700" width="840" height="210" rx="8" fill="#252526" stroke="#555555" stroke-width="1.5"/>
    <text x="100" y="725" fill="#cccccc" font-size="14" font-weight="bold">3. Handwriting Classification &amp; Clinical Verification</text>

    <!-- Node: Report Verification -->
    <rect x="120" y="750" width="340" height="45" rx="4" fill="#1e1e1e" stroke="#777777" stroke-width="1.2"/>
    <text x="290" y="777" fill="#ffffff" font-size="14" font-weight="500" text-anchor="middle">Report Verification Agent</text>

    <rect x="110" y="810" width="360" height="28" rx="4" fill="#2d2d2d" stroke="#444444"/>
    <text x="290" y="828" fill="#cccccc" font-size="11" text-anchor="middle">FindingValidator &amp; biological bounds check</text>

    <!-- Node: HW Classifier -->
    <rect x="540" y="750" width="340" height="45" rx="4" fill="#1e1e1e" stroke="#777777" stroke-width="1.2"/>
    <text x="710" y="777" fill="#ffffff" font-size="14" font-weight="500" text-anchor="middle">Handwriting Drug Classifier Agent</text>

    <rect x="530" y="810" width="360" height="28" rx="4" fill="#2d2d2d" stroke="#444444"/>
    <text x="710" y="828" fill="#cccccc" font-size="11" text-anchor="middle">candidate drug ranking &amp; confidence</text>

    <!-- Node: Rx Verification -->
    <line x1="710" y1="840" x2="710" y2="860" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="530" y="862" width="360" height="36" rx="4" fill="#1e1e1e" stroke="#777777" stroke-width="1.2"/>
    <text x="710" y="885" fill="#ffffff" font-size="13" font-weight="500" text-anchor="middle">Prescription Verification Agent</text>
  </g>

  <!-- Arrows Stage 3 to Stage 4 -->
  <line x1="290" y1="910" x2="290" y2="955" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="710" y1="910" x2="710" y2="955" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STAGE 4 SUBGRAPH -->
  <g filter="url(#shadow)">
    <rect x="50" y="960" width="900" height="270" rx="8" fill="#252526" stroke="#555555" stroke-width="1.5"/>
    <text x="70" y="985" fill="#cccccc" font-size="14" font-weight="bold">4. Safety Governance &amp; ML Safety Classifier</text>

    <!-- Node: Tabular ML Safety Agent -->
    <rect x="100" y="1005" width="340" height="45" rx="4" fill="#1e1e1e" stroke="#777777" stroke-width="1.2"/>
    <text x="270" y="1032" fill="#ffffff" font-size="14" font-weight="500" text-anchor="middle">Tabular ML Safety Agent</text>

    <!-- Arrow to Gate -->
    <line x1="270" y1="1050" x2="500" y2="1080" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="710" y1="960" x2="500" y2="1080" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Diamond Gate -->
    <polygon points="500,1050 670,1095 500,1140 330,1095" fill="#1e1e1e" stroke="#38bdf8" stroke-width="2"/>
    <text x="500" y="1092" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Deterministic Safety</text>
    <text x="500" y="1106" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Precedence Gate</text>

    <!-- Gate Outcome Branches -->
    <path d="M 330 1095 L 170 1095 L 170 1165" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="70" y="1167" width="200" height="45" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
    <text x="170" y="1194" fill="#fca5a5" font-size="13" font-weight="bold" text-anchor="middle">🔴 HARD STOP LOCK</text>

    <path d="M 500 1140 L 500 1165" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="400" y="1167" width="200" height="45" rx="4" fill="#78350f" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="500" y="1194" fill="#fde68a" font-size="13" font-weight="bold" text-anchor="middle">🟡 MANUAL REVIEW</text>

    <path d="M 670 1095 L 830 1095 L 830 1165" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="730" y="1167" width="200" height="45" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="830" y="1194" fill="#a7f3d0" font-size="13" font-weight="bold" text-anchor="middle">🟢 SAFE TO DISPLAY</text>
  </g>

  <!-- Arrows Stage 4 to Stage 5 -->
  <line x1="170" y1="1212" x2="170" y2="1275" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="1212" x2="500" y2="1275" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="830" y1="1212" x2="830" y2="1275" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STAGE 5 SUBGRAPH -->
  <g filter="url(#shadow)">
    <rect x="50" y="1280" width="900" height="220" rx="8" fill="#252526" stroke="#555555" stroke-width="1.5"/>
    <text x="70" y="1305" fill="#cccccc" font-size="14" font-weight="bold">5. Reasoning &amp; Presentation</text>

    <!-- Node 1: Zero LLM Policy -->
    <rect x="70" y="1325" width="200" height="50" rx="4" fill="#1e1e1e" stroke="#ef4444" stroke-width="1.2"/>
    <text x="170" y="1348" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Zero-LLM Hard Stop Policy</text>
    <text x="170" y="1364" fill="#fca5a5" font-size="11" text-anchor="middle">(0 LLM Calls)</text>

    <!-- Node 2: Manual Review Fallback -->
    <rect x="400" y="1325" width="200" height="50" rx="4" fill="#1e1e1e" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="500" y="1348" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Deterministic Manual</text>
    <text x="500" y="1364" fill="#fde68a" font-size="11" text-anchor="middle">Review Banner</text>

    <!-- Node 3: AI Reasoning -->
    <rect x="730" y="1325" width="200" height="50" rx="4" fill="#1e1e1e" stroke="#10b981" stroke-width="1.2"/>
    <text x="830" y="1348" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Reasoning Agent</text>
    <text x="830" y="1364" fill="#a7f3d0" font-size="11" text-anchor="middle">(AI Explanation)</text>

    <!-- Converge Arrows to Final Output -->
    <line x1="170" y1="1375" x2="500" y2="1420" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="500" y1="1375" x2="500" y2="1420" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="830" y1="1375" x2="500" y2="1420" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Node: Final Output -->
    <rect x="250" y="1425" width="500" height="50" rx="6" fill="#1e1e1e" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="500" y="1455" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">Final Patient Presentation &amp; Technical Audit Details Dropdown</text>
  </g>

</svg>
