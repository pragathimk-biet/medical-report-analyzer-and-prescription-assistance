<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1600" width="1000" height="1600" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title Banner -->
  <rect x="50" y="30" width="900" height="65" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="500" y="60" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">Fig. 1. Updated Overall Project Methodology</text>
  <text x="500" y="80" fill="#94a3b8" font-size="12" text-anchor="middle">Medical Report &amp; Prescription Analyzer — Full Structured Flow</text>

  <!-- STAGE 1 -->
  <g filter="url(#shadow)">
    <rect x="50" y="125" width="900" height="180" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="75" y="152" fill="#60a5fa" font-size="14" font-weight="bold">Stage 1: Input and Routing</text>

    <!-- Trapezoid Patient Upload -->
    <polygon points="350,170 650,170 620,205 380,205" fill="#0f172a" stroke="#60a5fa" stroke-width="1.2"/>
    <text x="500" y="192" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">Patient Upload (Report or Prescription Image)</text>

    <line x1="500" y1="205" x2="500" y2="230" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Diamond Router -->
    <polygon points="500,230 580,255 500,280 420,255" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="500" y="259" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">Router: Input Type?</text>
  </g>

  <!-- Connectors S1 to S2 -->
  <path d="M 420 255 L 290 255 L 290 330" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="345" y="248" fill="#94a3b8" font-size="11" text-anchor="middle">Report</text>

  <path d="M 580 255 L 710 255 L 710 330" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="655" y="248" fill="#94a3b8" font-size="11" text-anchor="middle">Prescription</text>

  <!-- STAGE 2 -->
  <g filter="url(#shadow)">
    <rect x="50" y="335" width="900" height="240" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="75" y="362" fill="#c4b5fd" font-size="14" font-weight="bold">Stage 2: Extraction and Preprocessing (Objective 1)</text>

    <!-- Report Box -->
    <rect x="90" y="380" width="400" height="45" rx="6" fill="#0f172a" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="290" y="407" fill="#f8fafc" font-size="12" text-anchor="middle">Image Enhancement (Grayscale, Denoising, Deskew)</text>

    <line x1="290" y1="425" x2="290" y2="455" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="90" y="455" width="400" height="45" rx="6" fill="#0f172a" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="290" y="482" fill="#f8fafc" font-size="12" text-anchor="middle">OCR: PaddleOCR PP-OCRv5 / RapidOCR</text>

    <!-- Prescription Box -->
    <rect x="510" y="380" width="400" height="45" rx="6" fill="#0f172a" stroke="#f472b6" stroke-width="1.2"/>
    <text x="710" y="407" fill="#f8fafc" font-size="12" text-anchor="middle">Drug-Extraction Vision-Language Model</text>

    <line x1="710" y1="425" x2="710" y2="455" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Model 2 Novelty Box (Bold Border) -->
    <rect x="510" y="455" width="400" height="75" rx="8" fill="#581c87" stroke="#c084fc" stroke-width="3"/>
    <text x="710" y="480" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Model 2 (New): MobileNetV2</text>
    <text x="710" y="498" fill="#e9d5ff" font-size="11" text-anchor="middle">Handwriting Cross-Check, Transfer Learning</text>
    <text x="710" y="515" fill="#f472b6" font-size="11" font-style="italic" text-anchor="middle">Novelty Addition</text>
  </g>

  <!-- Connectors S2 to S3 -->
  <line x1="290" y1="500" x2="290" y2="600" stroke="#38bdf8" stroke-width="2"/>
  <line x1="710" y1="530" x2="710" y2="600" stroke="#38bdf8" stroke-width="2"/>
  <line x1="290" y1="600" x2="710" y2="600" stroke="#38bdf8" stroke-width="2"/>
  <line x1="500" y1="600" x2="500" y2="620" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STAGE 3 -->
  <g filter="url(#shadow)">
    <rect x="50" y="625" width="900" height="230" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="75" y="652" fill="#fcd34d" font-size="14" font-weight="bold">Stage 3: Verification (Objective 2)</text>

    <rect x="90" y="670" width="400" height="45" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="290" y="692" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">Deterministic Rule Engine:</text>
    <text x="290" y="707" fill="#94a3b8" font-size="11" text-anchor="middle">Reference Range Validation (37 Biomarkers)</text>

    <rect x="510" y="670" width="400" height="45" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="710" y="697" fill="#f8fafc" font-size="12" text-anchor="middle">RapidFuzz Correction + RxNorm Drug Verification</text>

    <!-- Connectors to Model 1 -->
    <path d="M 290 715 L 290 740 L 500 740 L 500 750" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 710 715 L 710 740 L 500 740 L 500 750" fill="none" stroke="#38bdf8" stroke-width="2"/>

    <!-- Model 1 Novelty Box (Bold Border) -->
    <rect x="180" y="750" width="640" height="75" rx="8" fill="#78350f" stroke="#fbbf24" stroke-width="3"/>
    <text x="500" y="775" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Model 1 (New): Report Reliability Classifier —</text>
    <text x="500" y="793" fill="#fef3c7" font-size="11" text-anchor="middle">Decision Tree, trained on real MIMIC-III lab data</text>
    <text x="500" y="810" fill="#fcd34d" font-size="11" font-style="italic" text-anchor="middle">Novelty Addition</text>
  </g>

  <!-- Connector S3 to S4 -->
  <line x1="500" y1="825" x2="500" y2="880" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STAGE 4 -->
  <g filter="url(#shadow)">
    <rect x="50" y="885" width="900" height="180" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="75" y="912" fill="#6ee7b7" font-size="14" font-weight="bold">Stage 4: Reasoning and Safety</text>

    <rect x="230" y="930" width="540" height="45" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.2"/>
    <text x="500" y="957" fill="#f8fafc" font-size="12" text-anchor="middle">Reasoning Agent: Plain-Language Explanation (LLM)</text>

    <line x1="500" y1="975" x2="500" y2="1000" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="230" y="1000" width="540" height="45" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="500" y="1020" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Guardrail Agent: Diagnostic-Language Rewrite + Disclaimer</text>
    <text x="500" y="1035" fill="#a7f3d0" font-size="10" text-anchor="middle">(Mandatory, Runs Last)</text>
  </g>

  <!-- Connector S4 to S5 -->
  <line x1="500" y1="1065" x2="500" y2="1120" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STAGE 5 -->
  <g filter="url(#shadow)">
    <rect x="50" y="1125" width="900" height="160" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="75" y="1152" fill="#a5b4fc" font-size="14" font-weight="bold">Stage 5: Cross-Visit Safety and Interaction</text>

    <rect x="90" y="1170" width="400" height="65" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1.2"/>
    <text x="290" y="1197" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">Deterministic Drug-Biomarker Correlator</text>
    <text x="290" y="1215" fill="#94a3b8" font-size="11" text-anchor="middle">(FDA-Label Provenance)</text>

    <!-- Double-headed arrow -->
    <line x1="490" y1="1202" x2="510" y2="1202" stroke="#38bdf8" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

    <rect x="510" y="1170" width="400" height="65" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1.2"/>
    <text x="710" y="1197" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">Patient State Store</text>
    <text x="710" y="1215" fill="#94a3b8" font-size="11" text-anchor="middle">(Encrypted, UUID-based)</text>
  </g>

  <!-- Connector S5 to S6 -->
  <line x1="500" y1="1285" x2="500" y2="1340" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STAGE 6 -->
  <g filter="url(#shadow)">
    <rect x="50" y="1345" width="900" height="210" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="75" y="1372" fill="#fda4af" font-size="14" font-weight="bold">Stage 6: Patient Interaction</text>

    <!-- Custom RAG Chatbot Novelty Box (Bold Border) -->
    <rect x="180" y="1385" width="640" height="75" rx="8" fill="#881337" stroke="#f43f5e" stroke-width="3"/>
    <text x="500" y="1410" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Custom RAG Chatbot (New):</text>
    <text x="500" y="1428" fill="#fecdd3" font-size="11" text-anchor="middle">Retrieval from Structured Patient History</text>
    <text x="500" y="1445" fill="#fda4af" font-size="11" font-style="italic" text-anchor="middle">Novelty Addition</text>

    <line x1="500" y1="1460" x2="500" y2="1485" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Parallelogram Output -->
    <polygon points="180,1485 820,1485 790,1530 150,1530" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="485" y="1512" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Output: Patient-Facing Explanation, Alerts, and Follow-up Answers</text>
  </g>

</svg>
